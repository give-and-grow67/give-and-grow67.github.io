<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Give & Grow</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;

    background-image:
    linear-gradient(rgba(0,120,170,.2),rgba(0,80,130,.6)),
    url("background.jpg");

    background-size:cover;
    background-position:center;

    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;
}

.box{
    background:white;
    padding:40px;
    border-radius:25px;
    text-align:center;
    max-width:500px;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
}

h1{
    color:#008fc4;
}

a{
    display:inline-block;
    margin-top:20px;
    padding:12px 25px;
    background:#008fc4;
    color:white;
    text-decoration:none;
    border-radius:10px;
}
</style>

</head>
<body>

<div class="box">

    <h1>🎣 Give & Grow</h1>

    <h2>ลงทะเบียนสำเร็จแล้ว</h2>

    <p>
        ขณะนี้เกมกำลังพัฒนา<br>
        โปรดรออัปเดตเวอร์ชันถัดไป
    </p>

    <a href="index.html">
        กลับหน้าหลัก
    </a>

</div>

</body>
</html>
